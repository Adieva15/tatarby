
services:
  redis:
    image: redis:alpine
    container_name: my-redis-tatarby
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass "mypassword"
  postgres:
    image: postgres:16-alpine
    container_name: tatar_bd
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: